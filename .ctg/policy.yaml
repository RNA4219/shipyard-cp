version: ctg/v1

policy_id: shipyard-cp-policy
description: Quality policy for shipyard-cp repository

blocking:
  severity:
    critical: true
    high: false
    medium: false
    low: false
  category:
    auth: false
    payment: false
    validation: false
    data: false
    config: false
    maintainability: false
    testing: false
    compatibility: false
    releaseRisk: false
    security: false
  rules:
  count_threshold:
    critical_max: 0
    high_max: 100
    medium_max: 100
    low_max: 100

confidence:
  min_confidence: 0.6
  low_confidence_threshold: 0.4
  filter_low: true

llm:
  enabled: false
  mode: none
  require_llm: false

partial:
  allow_partial: true

suppression:
  file: .ctg/suppressions.yaml
  expiry_warning_days: 30
