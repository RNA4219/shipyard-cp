name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
env:
  NODE_VERSION: '24'
  PNPM_VERSION: '9.15.9'
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run check
      - run: pnpm run lint
      - run: pnpm exec vitest run --coverage
      - run: pnpm run build:backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:web
      - run: pnpm run test:web
      - run: pnpm run build:web
  performance:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run test:load
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Start backend
        run: |
          pnpm run dev > backend.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:3100/healthz && exit 0
            sleep 1
          done
          cat backend.log
          exit 1
      - run: pnpm --dir web exec playwright test --project=chromium
        env:
          CI: 'true'
          E2E_BACKEND_URL: http://localhost:3100
  container-smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build and start production compose
        env: &compose-env
          API_KEY: ci-operator-key
          ADMIN_API_KEY: ci-admin-key
          CORS_ORIGIN: http://localhost:5273
          REDIS_PASSWORD: ci-redis-password
        run: |
          docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml up --build --detach
          for attempt in {1..90}; do
            curl --fail --silent http://localhost:3100/healthz && break
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3100/v1/tasks)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-API-Key: ci-operator-key' http://localhost:3100/v1/tasks)" = "200"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-API-Key: ci-admin-key' http://localhost:3100/v1/tasks)" = "200"
          test "$(docker inspect --format '{{.Config.User}}' shipyard-ci-shipyard-cp-1)" = "node"
          docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml exec -T redis sh -ec 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli SET shipyard:smoke:persistence verified'
          docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml restart redis
          for attempt in {1..30}; do
            if docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml exec -T redis sh -ec 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping' | grep -qx PONG; then break; fi
            sleep 1
          done
          test "$(docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml exec -T redis sh -ec 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli GET shipyard:smoke:persistence')" = "verified"
          docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml stop shipyard-cp
          docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml start shipyard-cp
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3100/healthz; then break; fi
            sleep 1
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'X-API-Key: ci-operator-key' http://localhost:3100/v1/tasks)" = "200"
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: shipyard-ci-shipyard-cp, severity: 'CRITICAL,HIGH', ignore-unfixed: true, exit-code: '1' }
      - name: Logs
        if: failure()
        env: *compose-env
        run: docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml logs
      - name: Stop compose
        if: always()
        env: *compose-env
        run: docker compose --project-name shipyard-ci -f infra/docker/docker-compose.yml down --volumes
  repository-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:modules
      - run: pnpm run check:docs
