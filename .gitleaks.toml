[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

  [[rules.allowlists]]
  description = "Allow deterministic publish idempotency fixtures"
  condition = "AND"
  regexTarget = "line"
  paths = [
    '''test/integrate-publish\.test\.ts''',
  ]
  regexes = [
    '''idempotency_key:\s*[^,\n]*(?:idempotent-key|audit-key|key)-\d+''',
  ]

