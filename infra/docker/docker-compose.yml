services:
  # Control Plane - Main application
  shipyard-cp:
    build:
      context: ../..
      dockerfile: infra/docker/shipyard-cp/Dockerfile
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - PORT=3100
      - AUTH_ENABLED=true
      - API_KEY=${API_KEY:?API_KEY is required}
      - ADMIN_API_KEY=${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN is required}
      - REDIS_URL=redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - "REDIS_KEY_PREFIX=shipyard-cp:"
      - STORE_BACKEND=redis
      - REDIS_TASK_TTL=15552000
      - REDIS_JOB_TTL=2592000
      - REDIS_RESULT_TTL=2592000
      - REDIS_EVENT_TTL=31536000
      - REDIS_GOVERNANCE_TTL=15552000
      - REDIS_AUDIT_TTL=31536000
      - REDIS_CHECKPOINT_TTL=31536000
      # External service URLs are no longer required - using embedded packages
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - redis
    networks:
      - shipyard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for persistence (required for production)
  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$${REDIS_PASSWORD}\""]
    networks:
      - shipyard-network
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shipyard-network:
    driver: bridge

volumes:
  redis-data:
